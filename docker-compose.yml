# Local development database. Credentials are development-only and match .env.example — never reuse
# them anywhere else. Status: written but not yet run in the build environment (no Docker there).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: perfume
      POSTGRES_PASSWORD: perfume_dev_password
      POSTGRES_DB: perfume_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates perfume_test and perfume_e2e on first start (empty data volume only).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfume -d perfume_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
