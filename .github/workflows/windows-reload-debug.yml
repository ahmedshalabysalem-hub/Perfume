name: Windows reload debug

# Temporary: reproduces the dev-server reload loop seen on Windows and records which files change.
on:
  push:
    branches: ["claude/project-thread-c52qp1"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AI Projects/Perfume
    env:
      PERFUME_CI: "1"
      SEED_ADMIN_PASSWORD: ci-only-demo-pass-7391
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: AI Projects/Perfume
      - uses: actions/setup-node@v5
        with:
          node-version-file: AI Projects/Perfume/.nvmrc
          cache: npm
          cache-dependency-path: AI Projects/Perfume/package-lock.json
      - name: PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: root
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\psql.exe" -c "CREATE ROLE perfume LOGIN CREATEDB PASSWORD 'perfume_dev_password';"
          & "$env:PGBIN\createdb.exe" -O perfume perfume_dev
      - name: Start site
        run: |
          Start-Process cmd.exe -ArgumentList "/c", "scripts\windows\start.cmd" -RedirectStandardOutput start.log -RedirectStandardError start.err -NoNewWindow
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            try { if ((Invoke-WebRequest "http://localhost:3000/api/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { break } } catch {}
            if ((Get-Date) -gt $deadline) { throw "timeout" }
            Start-Sleep -Seconds 5
          }
          Invoke-WebRequest "http://localhost:3000/en" -UseBasicParsing -TimeoutSec 180 | Out-Null
          Invoke-WebRequest "http://localhost:3000/ar/login" -UseBasicParsing -TimeoutSec 180 | Out-Null
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Probe with a file watcher
        run: |
          $root = (Get-Location).Path
          $w = New-Object System.IO.FileSystemWatcher $root
          $w.IncludeSubdirectories = $true
          $w.NotifyFilter = [System.IO.NotifyFilters]'FileName, DirectoryName, LastWrite, Size, Attributes, LastAccess, CreationTime, Security'
          $events = New-Object System.Collections.Concurrent.ConcurrentQueue[string]
          $action = { $Event.MessageData.Enqueue("$($EventArgs.ChangeType) $($EventArgs.FullPath)") }
          foreach ($n in "Changed", "Created", "Deleted", "Renamed") { Register-ObjectEvent $w $n -MessageData $events -Action $action | Out-Null }
          $w.EnableRaisingEvents = $true
          node scripts/windows/debug/probe.mjs
          $w.EnableRaisingEvents = $false
          Start-Sleep -Seconds 1
          $all = $events.ToArray()
          Write-Host "---- watcher events outside node_modules (grouped) ----"
          $all | Where-Object { $_ -notmatch "\\node_modules\\" } | ForEach-Object { $_.Replace($root, "") } | Group-Object | Sort-Object Count -Descending | Select-Object -First 40 | ForEach-Object { "{0,6} {1}" -f $_.Count, $_.Name }
          Write-Host "---- node_modules events (grouped) ----"
          $all | Where-Object { $_ -match "\\node_modules\\" } | ForEach-Object { $_.Replace($root, "") } | Group-Object | Sort-Object Count -Descending | Select-Object -First 15 | ForEach-Object { "{0,6} {1}" -f $_.Count, $_.Name }
      - name: Dev server output
        if: always()
        run: |
          Get-Content start.log -Tail 120
          Get-Content start.err -Tail 40
