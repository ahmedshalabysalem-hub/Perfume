name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perfume
          # Throw-away credentials for this job's database container only.
          POSTGRES_PASSWORD: perfume_ci_password
          POSTGRES_DB: perfume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perfume -d perfume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://perfume:perfume_ci_password@localhost:5432/perfume_test?schema=public
      # Created on demand by tests/e2e/global-setup.ts.
      E2E_DATABASE_URL: postgresql://perfume:perfume_ci_password@localhost:5432/perfume_e2e?schema=public
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (generates the Prisma client)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Generate a throw-away auth secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # The build above is reused; the e2e server only needs starting.
          E2E_SERVER_COMMAND: npm run start -- --port 3100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  compose:
    # OPS-001: the local-development database from docker-compose.yml starts healthy, creates the test
    # databases and accepts every migration (postgres:16-alpine, the image developers run).
    name: Docker Compose database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Development-only credentials from docker-compose.yml.
      DATABASE_URL: postgresql://perfume:perfume_dev_password@localhost:5432/perfume_dev?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Check the initialised databases
        run: |
          databases="$(docker compose exec -T postgres psql -U perfume -d perfume_dev -Atc \
            "SELECT string_agg(datname, ' ' ORDER BY datname) FROM pg_database WHERE datname LIKE 'perfume%'")"
          echo "$databases"
          test "$databases" = "perfume_dev perfume_e2e perfume_test"

      - name: Install dependencies (generates the Prisma client)
        run: npm ci

      - name: Apply migrations and check for schema drift
        run: |
          npm run db:deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Container logs
        if: always()
        run: docker compose logs postgres

      - name: Stop and remove the database
        if: always()
        run: docker compose down -v
